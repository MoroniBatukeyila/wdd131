<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Explore a filtered gallery of temples from around the world."
    />
    <meta name="author" content="Moroni Kalala Batukeyila" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Open+Sans:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/filtered-temples.css" />
    <link
      rel="stylesheet"
      href="styles/filtered-temples-2.css"
      media="screen and (min-width: 48rem)"
    />
    <script src="scripts/filtered-temples.js" defer></script>
    <title>Temple Album | Moroni Kalala Batukeyila</title>
  </head>
  <body>
    <header>
      <div class="header-content">
        <p class="site-title">Temple Album</p>
        <button
          class="menu-toggle"
          type="button"
          aria-label="Open navigation menu"
          aria-expanded="false"
          aria-controls="primary-nav"
        >
          <span aria-hidden="true">☰</span>
        </button>
        <nav class="primary-nav" id="primary-nav" aria-label="Main navigation">
          <ul>
            <li>
              <a href="#gallery" data-filter="all" aria-current="page">Home</a>
            </li>
            <li><a href="#gallery" data-filter="old">Old</a></li>
            <li><a href="#gallery" data-filter="new">New</a></li>
            <li><a href="#gallery" data-filter="large">Large</a></li>
            <li><a href="#gallery" data-filter="small">Small</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main>
      <h1>Temples</h1>
      <section class="temple-gallery" id="gallery" aria-label="Temple gallery">
      </section>
    </main>

    <footer>
      <p>
        &copy;<span id="currentyear"></span> Moroni Kalala Batukeyila, Kinshasa,
        DRC
      </p>
      <p id="lastModified"></p>
    </footer>
  </body>
</html>
