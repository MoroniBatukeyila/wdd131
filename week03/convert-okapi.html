<!doctype html>
<meta charset="utf-8">
<img id="source" src="images/Okapi.jpeg" alt="">
<script>
  const source = document.querySelector("#source");
  const convert = () => {
    const width = Number(new URLSearchParams(location.search).get("width")) || 640;
    const height = Math.round(source.naturalHeight * width / source.naturalWidth);
    const canvas = Object.assign(document.createElement("canvas"), { width, height });
    canvas.getContext("2d").drawImage(source, 0, 0, width, height);
    document.body.textContent = canvas.toDataURL("image/webp", 0.88);
  };
  if (source.complete) convert(); else source.onload = convert;
</script>
